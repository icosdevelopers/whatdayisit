  (function () {
    var ua = navigator.userAgent || "";
    var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/i.test(ua);
    var playReady = PLAY_STORE_URL.indexOf("PAKET_ADI") === -1;
    function playUrl() {
      var utm = new URLSearchParams(location.search), keep = [];
      utm.forEach(function (v, k) { if (k.indexOf("utm_") === 0) keep.push(k + "=" + v); });
      return keep.length ? PLAY_STORE_URL + "&referrer=" + encodeURIComponent(keep.join("&")) : PLAY_STORE_URL;
    }
    window.__stores = { ios: APP_STORE_URL, android: playReady ? playUrl() : null };

  })();

<script>
  var s = window.__stores;
  document.getElementById("ios").href = s.ios;
  if (s.android) document.getElementById("android").href = s.android; else document.getElementById("android").hidden = true;
  var fav = document.createElement("link"); fav.rel = "icon"; fav.href = document.querySelector("[data-icon]").src; document.head.appendChild(fav);
  var DAYS = {"en": [["⌨️", "International Caps Lock Day", "#CapsLockDay"], ["🍫", "National Chocolate Day", "#NationalChocolateDay"], ["🎬", "National Horror Movie Day", "#HorrorMovieDay"], ["🍝", "World Pasta Day", "#WorldPastaDay"], ["👨‍🍳", "International Chefs Day", "#InternationalChefsDay"]], "tr": [["⌨️", "CAPS LOCK Günü", "#CAPSLOCKGÜNÜ"], ["🍫", "Çikolata Günü", "#ÇikolataGünü"], ["🎬", "Korku Filmi Günü", "#KorkuFilmiGünü"], ["🍝", "Dünya Makarna Günü", "#DünyaMakarnaGünü"], ["👨‍🍳", "Dünya Aşçılar Günü", "#DünyaAşçılarGünü"]], "ja": [["⌨️", "CAPS LOCKの日", "#キャップスロックの日"], ["🍫", "チョコレートの日", "#チョコレートの日"], ["🎬", "ホラー映画の日", "#ホラー映画の日"], ["🍝", "世界パスタデー", "#世界パスタデー"], ["👨‍🍳", "国際シェフの日", "#国際シェフの日"]]};
  // Dil: linkteki ?lang=, yoksa /en/ /tr/ /ja/ klasörü, yoksa cihaz dili
  var nav = (navigator.language || "").toLowerCase();
  var lang = new URLSearchParams(location.search).get("lang") || window.FORCE_LANG ||
             (nav.indexOf("tr") === 0 ? "tr" : nav.indexOf("ja") === 0 ? "ja" : "en");
  if (lang !== "tr" && lang !== "ja") lang = "en";
  var T = {
    tr: {title: "Bugün Günlerden Ne?", "ios1": "Hemen indirin", "and1": "HEMEN İNDİRİN", "name": "Bugün Günlerden Ne?", "h1": "Her gün <span>kutlanacak bir şey var.</span>", "pill": "Özel gün", "foot": "iPhone ve Android’de"},

  };
  if (T[lang]) {
    var tx = T[lang];
    document.documentElement.lang = lang; document.title = tx.title;
    document.querySelectorAll("[data-t]").forEach(function (el) { var k = el.getAttribute("data-t"); if (tx[k] != null) el.innerHTML = tx[k]; });
  }
  // Rotating example days (examples only; not a claim about today's date)
  var list = DAYS[lang], i = 0;
  function show() {
    var d = list[i % list.length];
    document.querySelectorAll("[data-day-emoji]").forEach(function (e) { e.textContent = d[0]; });
    document.querySelectorAll("[data-day-name]").forEach(function (e) { e.textContent = d[1]; });
    document.querySelectorAll("[data-day-tag]").forEach(function (e) { e.textContent = d[2]; });
    document.querySelectorAll("[data-day-swap]").forEach(function (e) { e.classList.remove("in"); void e.offsetWidth; e.classList.add("in"); });
    i++;
  }
  show();
  if (!window.__still) setInterval(show, 2400);
  // Visitor's own date (used by the calendar variant)
  var now = new Date(), loc = lang === "tr" ? "tr-TR" : lang === "ja" ? "ja-JP" : "en-US";
  document.querySelectorAll("[data-date-month]").forEach(function (e) { e.textContent = now.toLocaleDateString(loc, { month: "long" }); });
  document.querySelectorAll("[data-date-day]").forEach(function (e) { e.textContent = now.getDate(); });
  document.querySelectorAll("[data-date-weekday]").forEach(function (e) { e.textContent = now.toLocaleDateString(loc, { weekday: "long" }); });
</script>
