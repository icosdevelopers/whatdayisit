<script>
  // ===== AYARLAR: sadece bu iki satırı düzenle =====
  var APP_STORE_URL  = "https://apps.apple.com/app/id6765638833";
  var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=PAKET_ADI";
  // =================================================

  (function () {
    var ua = navigator.userAgent || "";
    var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); // iPadOS
    var isAndroid = /Android/i.test(ua);
    var iosReady = APP_STORE_URL.indexOf("UYGULAMA_ID") === -1;
    var playReady = PLAY_STORE_URL.indexOf("PAKET_ADI") === -1;

    // Linkteki utm_* parametrelerini Google Play'e "referrer" olarak aktar
    function playUrl() {
      var utm = new URLSearchParams(location.search), keep = [];
      utm.forEach(function (v, k) { if (k.indexOf("utm_") === 0) keep.push(k + "=" + v); });
      if (!keep.length) return PLAY_STORE_URL;
      return PLAY_STORE_URL + "&referrer=" + encodeURIComponent(keep.join("&"));
    }

    window.__stores = { ios: APP_STORE_URL, android: playReady ? playUrl() : null };

    if (isIOS && iosReady) { location.replace(APP_STORE_URL); }
    else if (isAndroid && playReady) { location.replace(playUrl()); }
  })();
</script>

<script>
  // Favicon: sayfadaki gömülü ikonu kullan
  var fav = document.createElement("link"); fav.rel = "icon";
  fav.href = document.querySelector(".icon").src; document.head.appendChild(fav);

  var s = window.__stores;
  document.getElementById("ios").href = s.ios;
  if (s.android) document.getElementById("android").href = s.android;
  else document.getElementById("android").hidden = true;

  // Varsayılan dil İngilizce. Türkçe için linke ?lang=tr ekle
  // (lang verilmezse Türkçe kullanan cihazlarda otomatik Türkçe açılır).

             ((navigator.language || "").toLowerCase().indexOf("tr") === 0 ? "tr" : "en");
